<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeClimate Dashboard</title>
  <style>
    :root { color-scheme: light; --ink:#102a43; --muted:#627d98; --line:#d9e2ec; --paper:#f3f7fb; --card:#fff; --accent:#c2410c; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,sans-serif; }
    main { max-width:1100px; margin:0 auto; padding:20px 16px 40px; }
    header { align-items:flex-start; display:flex; justify-content:space-between; gap:20px; margin-bottom:20px; }
    h1,h2,p { margin:0; }
    h1 { font-size:clamp(1.45rem,4vw,2.25rem); letter-spacing:-.02em; }
    h2 { font-size:1.15rem; margin-bottom:10px; }
    .eyebrow { color:var(--muted); font-size:.72rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin-bottom:5px; }
    .meta { color:var(--muted); font-size:.84rem; margin-top:6px; }
    .status { background:#e6ffed; border:1px solid #b7ebc6; border-radius:999px; color:#176b35; font-size:.75rem; font-weight:800; padding:7px 11px; white-space:nowrap; }
    .hero { background:linear-gradient(135deg,#102a43,#486581); border-radius:14px; color:#fff; margin-bottom:16px; padding:18px; }
    .hero .meta { color:#d9e2ec; }
    .grid { display:grid; gap:10px; grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:18px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; min-width:0; padding:13px; }
    .metric-label { color:var(--muted); font-size:.75rem; font-weight:750; }
    .metric-value { font-size:1.35rem; font-weight:850; margin-top:5px; }
    .metric-detail { color:var(--muted); font-size:.7rem; margin-top:3px; }
    .rooms { display:grid; gap:10px; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .room-name { font-size:.98rem; font-weight:800; }
    .room-values { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; }
    .room-value { font-size:.85rem; font-weight:700; }
    .room-detail { color:var(--muted); font-size:.72rem; margin-top:8px; }
    .section { margin-top:18px; }
    .empty { color:var(--muted); }
    nav { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 16px; }
    nav button, .back-button { background:#fff; border:1px solid var(--line); border-radius:8px; color:var(--ink); cursor:pointer; font:inherit; font-size:.78rem; font-weight:750; padding:9px 12px; }
    nav button.active, nav button:hover, .back-button:hover { background:#102a43; border-color:#102a43; color:#fff; }
    .nav-status { align-items:center; background:#e6ffed; border:1px solid #b7ebc6; border-radius:8px; color:#176b35; display:inline-flex; font-size:.72rem; font-weight:800; margin-left:auto; padding:8px 11px; }
    .room-card { cursor:pointer; text-align:left; width:100%; }
    .room-card:hover { border-color:#9fb3c8; box-shadow:0 3px 12px rgba(16,42,67,.08); }
    .chart-wrap { overflow:hidden; }
    .chart-wrap svg { display:block; height:auto; max-width:100%; width:100%; }
    .chart-legend { color:var(--muted); display:flex; font-size:.75rem; gap:18px; padding:0 0 4px 28px; }
    .chart-legend span { font-weight:750; }
    .chart-axis-title { fill:var(--muted); font-size:11px; font-weight:750; }
    .report-table { border-collapse:collapse; width:100%; }
    .report-table th, .report-table td { border-bottom:1px solid var(--line); padding:9px 7px; text-align:left; }
    .report-table th { color:var(--muted); font-size:.72rem; text-transform:uppercase; }
    .chart-grid { display:grid; gap:12px; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .chart-grid .card { overflow:hidden; }
    .forecast-grid { display:grid; gap:10px; grid-template-columns:repeat(4,minmax(0,1fr)); padding-bottom:4px; }
    .forecast-day { min-width:0; }
    .forecast-day-today { border-color:#c2410c; box-shadow:inset 0 3px 0 #c2410c; }
    .forecast-day__head { align-items:center; display:flex; justify-content:space-between; gap:8px; }
    .forecast-day__icon { font-size:1.7rem; line-height:1; }
    .forecast-day__condition { color:var(--muted); font-size:.72rem; min-height:2.2em; margin-top:8px; }
    .forecast-day__temps { align-items:baseline; display:flex; gap:8px; margin-top:11px; }
    .forecast-day__temps strong { color:#c2410c; font-size:1.25rem; }
    .forecast-day__temps span { color:var(--muted); font-size:.85rem; }
    .forecast-range { background:#e6edf3; border-radius:99px; height:6px; margin:8px 0 10px; position:relative; }
    .forecast-range span { background:linear-gradient(90deg,#5b8fb9,#c2410c); border-radius:99px; height:100%; position:absolute; }
    .forecast-chart-wrap { overflow:hidden; }
    .forecast-chart-wrap svg { display:block; height:auto; max-width:100%; width:100%; }
    .forecast-chart-legend { color:var(--muted); display:flex; flex-wrap:wrap; font-size:.72rem; gap:16px; margin:3px 0 0 44px; }
    .forecast-chart-legend span::before { content:"● "; font-weight:900; }
    .forecast-chart-legend__temp::before { color:#c2410c !important; }
    .forecast-chart-legend__apparent::before { color:#64748b !important; }
    .forecast-chart-legend__wind::before { color:#2f855a !important; }
    .forecast-chart-legend__rain::before { color:#8fc6e8 !important; }
    .schema-card { overflow:hidden; }
    .schema-card svg { display:block; height:auto; max-width:100%; width:100%; }
    .configured-edges path { fill:none; stroke:#6b8b93; stroke-linecap:round; stroke-width:6; }
    .configured-node-body { fill:#fff; stroke:#377c82; stroke-width:2; }
    .configured-node-shape { fill:#e8f3f1; stroke:#377c82; stroke-width:2; }
    .configured-node-tank { fill:#d9f0ec; }
    .configured-node-sensor-card .configured-node-body { fill:#fffdf5; stroke:#c58a22; stroke-width:2.5; }
    .configured-node-sensor { fill:#fff4c7; stroke:#c58a22; }
    .configured-node-title { fill:#153047; font-family:Georgia,"Times New Roman",serif; font-weight:700; }
    .configured-node-type { fill:#647b87; font:11px ui-sans-serif,system-ui,sans-serif; }
    .configured-node-status { fill:#0f766e; font:700 12px ui-sans-serif,system-ui,sans-serif; }
    .configured-node-value { fill:#377c82; font:11px ui-monospace,monospace; }
    .configured-node-value-panel { fill:#fff1bd; stroke:#e1b84f; stroke-width:1; }
    .configured-node-value-panel:not(.configured-node-value-panel-sensor) { fill:#e8f3f1; stroke:#9fcfc7; }
    .configured-node-value-panel-sensor { fill:#fff1bd; stroke:#e1b84f; }
    .configured-node-value-large { fill:#805b08; font-size:15px; font-weight:800; }
    .series-controls { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
    .series-controls button { background:#fff; border:1px solid var(--line); border-radius:8px; color:var(--ink); cursor:pointer; font:inherit; font-size:.75rem; font-weight:750; padding:8px 10px; }
    .series-controls button.active { background:#102a43; border-color:#102a43; color:#fff; }
    .feature-table { max-height:420px; overflow:auto; }
    .feature-table table { border-collapse:collapse; width:100%; }
    .feature-table th, .feature-table td { border-bottom:1px solid var(--line); padding:7px; text-align:left; }
    .dhw-history__summary { display:grid; gap:10px; grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:16px; }
    .dhw-history__summary div { background:#fffaf0; border:1px solid #fde68a; border-radius:8px; padding:10px; }
    .dhw-history__summary span { color:#92400e; display:block; font-size:.7rem; font-weight:750; }
    .dhw-history__summary strong { color:#78350f; display:block; font-size:1.15rem; margin-top:4px; }
    .dhw-history__chart { overflow:hidden; }
    .dhw-history__chart svg { display:block; height:auto; max-width:100%; width:100%; }
    .dhw-history__note { color:var(--muted); font-size:.72rem; margin-top:8px; }
    .storage-history-grid { display:grid; gap:12px; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .storage-history-grid--combined { grid-template-columns:1fr; }
    .combined-storage-legend { color:var(--muted); display:flex; flex-wrap:wrap; font-size:.75rem; gap:18px; margin-top:8px; }
    .combined-storage-legend span::before { content:"━ "; font-weight:900; }
    .combined-storage-legend__dhw::before { color:#d97706 !important; }
    .combined-storage-legend__buffer::before { color:#2563eb !important; }
    .actual::before { color:#c2410c; content:"━ "; font-weight:900; }
    .target::before { color:#64748b; content:"┄ "; font-weight:900; }
    .error { border-color:#fecaca; color:#991b1b; }
    @media (max-width:700px) {
      main { padding:14px 12px 28px; }
      header { align-items:flex-start; }
      .status { font-size:.68rem; }
      .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .rooms { grid-template-columns:1fr; }
      .chart-grid { grid-template-columns:1fr; }
      .forecast-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .dhw-history__summary { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .card { padding:11px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow" id="app-version">HomeClimate · Migration</div><h1>HomeClimate Dashboard</h1></div>
      <div class="status" id="app-status">API</div>
    </header>
    <nav aria-label="Migration views"><button class="active" data-view="home">Home</button><button data-view="rooms">Alle Räume</button><button data-view="room-report">Raumbericht</button><button data-view="charts">Alle Diagramme</button><button data-view="heat-pump">Wärmepumpe</button><button data-view="weather">Wetter</button><span class="nav-status" id="operating-status">Betriebsstand wird geladen ...</span></nav>
    <section class="hero"><div class="eyebrow" style="color:#bcccdc">Neue Oberfläche</div><h2 id="page-title" style="font-size:1.35rem;margin:0">Dein Zuhause auf einen Blick</h2><p class="meta" id="freshness">Daten werden geladen ...</p></section>
    <section class="grid" id="metrics"></section>
    <div id="content"><p class="empty">Daten werden geladen ...</p></div>
  </main>
  <script src="/app.js?v=0.10.21"></script>
</body>
</html>
