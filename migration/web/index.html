<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeClimate Dashboard</title>
  <style>
    :root { color-scheme: light; --ink:#102a43; --muted:#627d98; --line:#d9e2ec; --paper:#f3f7fb; --card:#fff; --accent:#c2410c; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,sans-serif; }
    main { max-width:1100px; margin:0 auto; padding:20px 16px 40px; }
    header { align-items:flex-start; display:flex; justify-content:space-between; gap:20px; margin-bottom:20px; }
    h1,h2,p { margin:0; }
    h1 { font-size:clamp(1.45rem,4vw,2.25rem); letter-spacing:-.02em; }
    h2 { font-size:1.15rem; margin-bottom:10px; }
    .eyebrow { color:var(--muted); font-size:.72rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin-bottom:5px; }
    .meta { color:var(--muted); font-size:.84rem; margin-top:6px; }
    .status { background:#e6ffed; border:1px solid #b7ebc6; border-radius:999px; color:#176b35; font-size:.75rem; font-weight:800; padding:7px 11px; white-space:nowrap; }
    .hero { background:linear-gradient(135deg,#102a43,#486581); border-radius:14px; color:#fff; margin-bottom:16px; padding:18px; }
    .hero .meta { color:#d9e2ec; }
    .grid { display:grid; gap:10px; grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:18px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; min-width:0; padding:13px; }
    .metric-label { color:var(--muted); font-size:.75rem; font-weight:750; }
    .metric-value { font-size:1.35rem; font-weight:850; margin-top:5px; }
    .metric-detail { color:var(--muted); font-size:.7rem; margin-top:3px; }
    .rooms { display:grid; gap:10px; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .room-name { font-size:.98rem; font-weight:800; }
    .room-values { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; }
    .room-value { font-size:.85rem; font-weight:700; }
    .room-detail { color:var(--muted); font-size:.72rem; margin-top:8px; }
    .section { margin-top:18px; }
    .empty { color:var(--muted); }
    nav { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 16px; }
    nav button, .back-button { background:#fff; border:1px solid var(--line); border-radius:8px; color:var(--ink); cursor:pointer; font:inherit; font-size:.78rem; font-weight:750; padding:9px 12px; }
    nav button.active, nav button:hover, .back-button:hover { background:#102a43; border-color:#102a43; color:#fff; }
    .room-card { cursor:pointer; text-align:left; width:100%; }
    .room-card:hover { border-color:#9fb3c8; box-shadow:0 3px 12px rgba(16,42,67,.08); }
    .chart-wrap { overflow-x:auto; }
    .chart-wrap svg { display:block; min-width:560px; width:100%; }
    .chart-legend { color:var(--muted); display:flex; font-size:.75rem; gap:18px; padding:0 0 4px 28px; }
    .chart-legend span { font-weight:750; }
    .chart-axis-title { fill:var(--muted); font-size:11px; font-weight:750; }
    .report-table { border-collapse:collapse; width:100%; }
    .report-table th, .report-table td { border-bottom:1px solid var(--line); padding:9px 7px; text-align:left; }
    .report-table th { color:var(--muted); font-size:.72rem; text-transform:uppercase; }
    .chart-grid { display:grid; gap:12px; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .chart-grid .card { overflow:hidden; }
    .forecast-grid { display:grid; gap:10px; grid-template-columns:repeat(4,minmax(0,1fr)); }
    .forecast-day { min-width:0; }
    .schema-card { overflow-x:auto; }
    .schema-card svg { display:block; min-width:720px; width:100%; }
    .series-controls { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
    .series-controls button { background:#fff; border:1px solid var(--line); border-radius:8px; color:var(--ink); cursor:pointer; font:inherit; font-size:.75rem; font-weight:750; padding:8px 10px; }
    .series-controls button.active { background:#102a43; border-color:#102a43; color:#fff; }
    .feature-table { max-height:420px; overflow:auto; }
    .feature-table table { border-collapse:collapse; width:100%; }
    .feature-table th, .feature-table td { border-bottom:1px solid var(--line); padding:7px; text-align:left; }
    .actual::before { color:#c2410c; content:"━ "; font-weight:900; }
    .target::before { color:#64748b; content:"┄ "; font-weight:900; }
    .error { border-color:#fecaca; color:#991b1b; }
    @media (max-width:700px) {
      main { padding:14px 12px 28px; }
      header { align-items:flex-start; }
      .status { font-size:.68rem; }
      .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .rooms { grid-template-columns:1fr; }
      .chart-grid, .forecast-grid { grid-template-columns:1fr; }
      .card { padding:11px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow" id="app-version">HomeClimate · Migration</div><h1>HomeClimate Dashboard</h1></div>
      <div class="status" id="app-status">API</div>
    </header>
    <nav aria-label="Migration views"><button class="active" data-view="home">Home</button><button data-view="rooms">Alle Räume</button><button data-view="room-report">Raumbericht</button><button data-view="charts">Alle Diagramme</button><button data-view="heat-pump">Wärmepumpe</button><button data-view="weather">Wetter</button></nav>
    <section class="hero"><div class="eyebrow" style="color:#bcccdc">Neue Oberfläche</div><h2 id="page-title" style="font-size:1.35rem;margin:0">Dein Zuhause auf einen Blick</h2><p class="meta" id="freshness">Daten werden geladen ...</p></section>
    <section class="grid" id="metrics"></section>
    <div id="content"><p class="empty">Daten werden geladen ...</p></div>
  </main>
  <script src="/app.js?v=0.10.15"></script>
</body>
</html>
